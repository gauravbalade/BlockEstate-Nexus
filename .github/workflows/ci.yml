name: Validate project
on:
  push:
    branches: [main, 'foundation/**', 'fixes/**']
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/BlockEstate.Api/BlockEstate.Api.csproj
      - run: dotnet build backend/BlockEstate.Api/BlockEstate.Api.csproj --no-restore
